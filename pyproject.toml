[project]
name = "epgfn"
version = "1.0.0"
description = "Risk-sensitive DRO-CVaR reward composition with exact targets and a conditional GFlowNet"
requires-python = ">=3.11"
dependencies = ["numpy", "scipy", "torch", "matplotlib", "scienceplots", "tqdm"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools]
packages = ["epgfn"]

[tool.pytest.ini_options]
testpaths = ["tests"]
